name: Raido Video Editor - build debug APK

on:
  push:
    paths:
      - "raido-video-editor/**"
      - ".github/workflows/raido-android-debug-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raido-video-editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: raido-video-editor-debug-apk
          path: raido-video-editor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
